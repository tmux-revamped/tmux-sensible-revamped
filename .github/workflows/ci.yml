---
name: ci

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore: ['**.md']
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  plan:
    name: choose the macOS legs
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.choose.outputs.macos }}
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit
      - name: Run every macOS leg except on a bot pull request
        id: choose
        env:
          EVENT: ${{ github.event_name }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          legs='[{"os":"macos-26","shell":"/bin/sh","toolset":"native","coverage":false},{"os":"macos-26","shell":"/bin/bash","toolset":"native","coverage":false},{"os":"macos-26","shell":"/bin/zsh","toolset":"native","coverage":false},{"os":"macos-26","shell":"/opt/homebrew/bin/bash","toolset":"homebrew","coverage":true},{"os":"macos-26","shell":"/opt/homebrew/bin/zsh","toolset":"homebrew","coverage":false},{"os":"macos-26","shell":"/bin/sh","toolset":"uutils","coverage":false},{"os":"macos-26-intel","shell":"/bin/sh","toolset":"native","coverage":false}]'
          case "${EVENT}:${AUTHOR}" in
          'pull_request:dependabot[bot]' | 'pull_request:renovate[bot]')
            legs='[{"os":"macos-26","shell":"/opt/homebrew/bin/bash","toolset":"homebrew","coverage":true}]'
            ;;
          *) ;;
          esac
          echo "macos=${legs}" >> "${GITHUB_OUTPUT}"

  lint:
    name: lint and format
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install shfmt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v3.14.1 --repo mvdan/sh --pattern 'shfmt_v3.14.1_linux_amd64' --output shfmt
          echo "76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf  shfmt" | sha256sum -c -
          sudo install -m 755 shfmt /usr/local/bin/shfmt
      - name: Install ShellCheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v0.11.0 --repo koalaman/shellcheck \
            --pattern 'shellcheck-v0.11.0.linux.x86_64.tar.xz' --output shellcheck.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz --strip-components=1 --wildcards '*/shellcheck'
          sudo install -m 755 shellcheck /usr/local/bin/shellcheck
      - name: Install actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.7.12 --repo rhysd/actionlint \
            --pattern 'actionlint_1.7.12_linux_amd64.tar.gz' --output actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 755 actionlint /usr/local/bin/actionlint
      - name: Install yamllint, mandoc and zsh
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq yamllint mandoc zsh
      - name: Lint at zero findings
        run: make lint

  test-linux:
    name: test (${{ matrix.os }}, ${{ matrix.shell }}, ${{ matrix.toolset }})
    needs: [plan]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-26.04, shell: dash, toolset: native, coverage: false}
          - {os: ubuntu-26.04, shell: zsh, toolset: native, coverage: false}
          - {os: ubuntu-26.04, shell: bash, toolset: native, coverage: true}
          - {os: ubuntu-26.04, shell: dash, toolset: gnu, coverage: false}
          - {os: ubuntu-26.04, shell: dash, toolset: uutils, coverage: false}
          - {os: ubuntu-26.04, shell: dash, toolset: busybox, coverage: false}
          - {os: ubuntu-26.04-arm, shell: dash, toolset: native, coverage: false}
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install shells and tools
        env:
          TOOLSET: ${{ matrix.toolset }}
        run: |
          set -euo pipefail
          extra=()
          case "${TOOLSET}" in
          gnu) extra=(gnu-coreutils gawk) ;;
          uutils) extra=(rust-coreutils) ;;
          busybox) extra=(busybox) ;;
          *) ;;
          esac
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats dash zsh tmux "${extra[@]}"
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18  # v1.343.0
        if: matrix.coverage
        with:
          bundler-cache: true
      - name: Build the ${{ matrix.toolset }} toolset
        env:
          TOOLSET: ${{ matrix.toolset }}
        run: sh .github/scripts/toolset.sh "${TOOLSET}" "${RUNNER_TEMP}/toolset" > "${RUNNER_TEMP}/toolset-path"
      - name: Run the suites under ${{ matrix.shell }}
        if: ${{ !matrix.coverage }}
        env:
          REVAMPED_TEST_SHELLS: ${{ matrix.shell }}
        run: |
          set -eu
          marker="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::${marker}"
          dirs="$(paste -s -d : "${RUNNER_TEMP}/toolset-path")"
          PATH="${dirs:+${dirs}:}${PATH}" sh test/run-matrix.sh
          echo "::${marker}::"
      - name: Run the suites under bashcov
        if: matrix.coverage
        run: |
          set -eu
          marker="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::${marker}"
          ruby_dir="$(dirname "$(command -v ruby)")"
          dirs="$(paste -s -d : "${RUNNER_TEMP}/toolset-path")"
          PATH="${ruby_dir}:${dirs:+${dirs}:}${PATH}" sh .github/scripts/coverage.sh
          echo "::${marker}::"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: matrix.coverage
        with:
          name: coverage-Linux
          path: coverage/.resultset.json
          include-hidden-files: true
          retention-days: 1

  test-macos:
    name: test (${{ matrix.os }}, ${{ matrix.shell }}, ${{ matrix.toolset }})
    needs: [plan, lint, test-linux]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.macos) }}
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install the tools in the Brewfile
        env:
          HOMEBREW_REVAMPED_TOOLSET: ${{ matrix.toolset }}
        run: brew bundle --file Brewfile
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18  # v1.343.0
        if: matrix.coverage
        with:
          bundler-cache: true
      - name: Build the ${{ matrix.toolset }} toolset
        env:
          TOOLSET: ${{ matrix.toolset }}
        run: sh .github/scripts/toolset.sh "${TOOLSET}" "${RUNNER_TEMP}/toolset" > "${RUNNER_TEMP}/toolset-path"
      - name: Run the suites under ${{ matrix.shell }}
        if: ${{ !matrix.coverage }}
        env:
          REVAMPED_TEST_SHELLS: ${{ matrix.shell }}
        run: |
          set -eu
          marker="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::${marker}"
          dirs="$(paste -s -d : "${RUNNER_TEMP}/toolset-path")"
          PATH="${dirs:+${dirs}:}${PATH}" sh test/run-matrix.sh
          echo "::${marker}::"
      - name: Run the suites under bashcov
        if: matrix.coverage
        run: |
          set -eu
          marker="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::${marker}"
          ruby_dir="$(dirname "$(command -v ruby)")"
          dirs="$(paste -s -d : "${RUNNER_TEMP}/toolset-path")"
          PATH="${ruby_dir}:${dirs:+${dirs}:}${PATH}" sh .github/scripts/coverage.sh
          echo "::${marker}::"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: matrix.coverage
        with:
          name: coverage-macOS
          path: coverage/.resultset.json
          include-hidden-files: true
          retention-days: 1

  coverage-gate:
    name: coverage gate
    needs: [test-linux, test-macos]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: coverage-*
          path: results
      - name: Merge both platforms and enforce 100% line coverage
        run: >-
          python3 .github/scripts/coverage-gate.py '/(lib/[a-z]+\.sh|bin/[a-z-]+)\Z' 100
          results/coverage-Linux/.resultset.json results/coverage-macOS/.resultset.json

  security:
    name: security
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Audit the workflows
        # yamllint disable-line rule:line-length
        uses: docker://ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101
        with:
          args: --persona=regular --format=plain .github/workflows

  scorecard:
    name: openssf scorecard
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run the OpenSSF Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5  # v2.6.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
      - name: Upload the result
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          sarif_file: scorecard.sarif
