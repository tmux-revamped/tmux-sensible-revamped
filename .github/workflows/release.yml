---
name: release

on:
  workflow_run:  # zizmor: ignore[dangerous-triggers]
    workflows: [ci]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    name: recover main
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-26.04
    timeout-minutes: 355
    concurrency:
      group: recover-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
    outputs:
      sha: ${{ steps.state.outputs.sha }}
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Restart ci when GitHub never gave a job a runner, wait for it, and release a green main
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh .github/scripts/recover.sh "${GITHUB_REPOSITORY}"

  release:
    name: release
    needs: [recover]
    if: >-
      !cancelled()
      && ((github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
      || needs.recover.outputs.sha != '')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || needs.recover.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: lts/*
      - name: Install release tooling
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
      - name: Audit the release tooling
        run: pnpm audit --audit-level high
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
